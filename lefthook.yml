pre-commit:
  parallel: true
  commands:
    biome:
      glob: "**/*.{ts,tsx,js,jsx,json}"
      run: pnpm biome check --write {staged_files}
      stage_fixed: true
commit-msg:
  commands:
    dco:
      # Lefthook substitutes {1} with the commit-msg file path (git hook arg $1).
      # Do NOT change to shell "$1" — that would be empty inside lefthook's sh -c invocation.
      run: |
        grep -q '^Signed-off-by: ' {1} || { echo 'Commit missing Signed-off-by trailer (use git commit -s)'; exit 1; }
